# Two captured payments for one order: a double click, or the client retrying checkout
# after a timeout. Each payment gets its own payment.captured with its own payment id,
# so deduping on the event id or payment id alone lets both through.

name: double-payment
description: >
  A share of orders are paid twice: two captured payments with different payment ids
  for the same order id. The order must be credited or fulfilled once and the extra
  payment refunded. Run it with --verify-cmd counting orders credited more than once:
  the count must not grow.

category: webhook_ordering

parameters:
  baseline_orders:
    default: 20
    description: Number of orders
  double_pay_rate:
    default: 0.5
    description: Share of orders that receive a second captured payment
  avg_order_value_paise:
    default: 50000
    description: Average order value in paise

phases:
  - name: pay
    description: Orders paid and captured
    actions:
      - create_orders:
          count: "${baseline_orders}"
          amount_paise: "${avg_order_value_paise}"
      - create_payments:
          for_each: orders
          success_rate: 1.0
      - capture_payments:
          for_each: successful_payments

  - name: pay-again
    description: A second captured payment for some of the same orders
    depends_on: pay
    actions:
      - duplicate_payments:
          for_each: captured_payments
          rate: "${double_pay_rate}"

validations:
  - check: orders_count
    description: Orders created
    expected: ">= ${baseline_orders}"
    severity: high
  - check: payments_captured_count
    description: One captured payment per order plus the second payments
    expected: ">= ${baseline_orders + baseline_orders * double_pay_rate}"
    severity: high

verify:
  expect: unchanged
  counts: orders credited more than once
  fix: >-
    key the credit on the order (a unique constraint on order_id) and refund the second payment
